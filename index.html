<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1eb" />
    <meta
      name="description"
      content="Álbum editorial de la boda de Kaoutar y Alberto, celebrada el 11 de octubre de 2025 en el Hotel Don Carlos."
    />
    <title>Kaoutar &amp; Alberto — Álbum de boda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260930-final" />
  </head>
  <body>
    <main class="album-reader" aria-label="Álbum de boda de Kaoutar y Alberto">
      <p class="sr-only" id="readerStatus" aria-live="polite">Cubierta</p>

      <section class="reader-stage" aria-live="polite">
        <div class="spread-frame">
          <div id="spreadMount" class="spread-mount"></div>
        </div>
        <button class="page-hotspot page-hotspot--prev" id="previousHotspot" type="button" aria-label="Pliego anterior"></button>
        <button class="page-hotspot page-hotspot--next" id="nextHotspot" type="button" aria-label="Pliego siguiente"></button>
      </section>

      <footer class="reader-footer" aria-label="Navegación del álbum">
        <button class="nav-button" id="previousButton" type="button" aria-label="Pliego anterior">
          <span aria-hidden="true">←</span>
          <span class="sr-only">Anterior</span>
        </button>

        <span class="sr-only" id="progressCurrent">Cubierta</span>
        <span class="sr-only" id="progressTotal">42</span>

        <button class="nav-button nav-button--next" id="nextButton" type="button" aria-label="Pliego siguiente">
          <span class="sr-only">Siguiente</span>
          <span aria-hidden="true">→</span>
        </button>
      </footer>
    </main>

    <script src="album-data.js?v=20260930-final" defer></script>
    <script src="script.js?v=20260930-final" defer></script>
  </body>
</html>
